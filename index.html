<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>政务服务知识答题系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            width: 90%;
            max-width: 1024px;
            height: 90vh;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: linear-gradient(135deg, #1a6dbe 0%, #2a8ae4 100%);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .title {
            font-size: 24px;
            font-weight: 600;
        }
        
        .timer {
            font-size: 20px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 20px;
        }
        
        .progress-bar {
            height: 6px;
            background-color: #e0e0e0;
            width: 100%;
        }
        
        .progress {
            height: 100%;
            background: linear-gradient(90deg, #4caf50, #8bc34a);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .quiz-container {
            padding: 30px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        .question-number {
            color: #1a6dbe;
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        .question-text {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        
        .options-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 20px;
            flex: 1;
        }
        
        .option {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: flex-start;
            /* 禁用选项区域的点击 */
            pointer-events: none;
        }
        
        .option.selected {
            background: #e3f2fd;
            border-color: #1a6dbe;
        }
        
        .option-label {
            display: inline-block;
            width: 30px;
            height: 30px;
            background: #1a6dbe;
            color: white;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        
        .option-text {
            flex: 1;
        }
        
        .bottom-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }
        
        .options-labels {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .option-letter {
            width: 50px;
            height: 50px;
            background: #f0f0f0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .option-letter.selected {
            background: #1a6dbe;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(26, 109, 190, 0.3);
        }
        
        .option-letter:hover {
            background: #e0e0e0;
        }
        
        .option-letter.selected:hover {
            background: #1a6dbe;
        }
        
        .navigation {
            display: flex;
            gap: 15px;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .btn-next {
            background: #1a6dbe;
            color: white;
        }
        
        .btn-submit {
            background: #4caf50;
            color: white;
        }
        
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .result-container {
            padding: 30px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            flex: 1;
        }
        
        .result-title {
            font-size: 28px;
            margin-bottom: 30px;
            color: #1a6dbe;
        }
        
        .score {
            font-size: 72px;
            font-weight: bold;
            color: #4caf50;
            margin: 20px 0;
        }
        
        .result-details {
            margin-top: 30px;
            width: 100%;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .result-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }
        
        .correct {
            color: #4caf50;
        }
        
        .incorrect {
            color: #f44336;
        }
        
        .question-review {
            margin-top: 10px;
            padding-left: 20px;
        }
        
        .correct-answer {
            color: #4caf50;
            font-weight: 500;
        }
        
        .user-answer {
            color: #f44336;
        }
        
        .restart-btn {
            margin-top: 30px;
            background: #1a6dbe;
            color: white;
            padding: 12px 30px;
            font-size: 18px;
        }
        
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
                flex-direction: column;
                gap: 10px;
            }
            
            .title {
                font-size: 20px;
            }
            
            .timer {
                font-size: 18px;
            }
            
            .quiz-container {
                padding: 20px;
            }
            
            .bottom-area {
                flex-direction: column;
                gap: 20px;
            }
            
            .options-labels {
                order: 2;
            }
            
            .navigation {
                order: 1;
                width: 100%;
                justify-content: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title">政务服务知识答题系统</div>
            <div class="timer" id="timer">01:00</div>
        </header>
        
        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>
        
        <div class="quiz-container" id="quiz-container">
            <div class="question-number" id="question-number">题目 1 / 30</div>
            <div class="question-text" id="question-text"></div>
            
            <div class="options-container" id="options-container">
                <!-- 选项将通过JavaScript动态生成 -->
            </div>
            
            <div class="bottom-area">
                <div class="options-labels" id="options-labels">
                    <!-- 选项字母将通过JavaScript动态生成 -->
                </div>
                
                <div class="navigation">
                    <button class="btn-next" id="next-btn">下一题</button>
                    <button class="btn-submit" id="submit-btn" style="display: none;">提交答案</button>
                </div>
            </div>
        </div>
        
        <div class="result-container" id="result-container">
            <div class="result-title">答题结果</div>
            <div class="score" id="score">0</div>
            <div style="font-size: 18px; margin-bottom: 30px;">
                您答对了 <span id="correct-count">0</span> 道题，共 <span id="total-count">0</span> 道题
            </div>
            
            <div class="result-details" id="result-details">
                <!-- 答题详情将通过JavaScript动态生成 -->
            </div>
            
            <button class="restart-btn" id="restart-btn">重新开始</button>
        </div>
    </div>

                    "B.统一支付体系",
                    "C.统一电子证照库",
                    "D.促进云计算、大数据、物联网、移动互联网等在政务服务中的应用"
                ],
                correctAnswers: ["A", "B", "C", "D"]
            },
            {
                question: "确定答复政府信息公开申请的一般时限须考虑的主要因素是（ ）。",
                options: [
                    "A.能够区分处理",
                    "B.行政机关要从便民原则出发，答复政府信息公开申请",
                    "C.时限必须明确",
                    "D.坚持公共利益优先原则",
                    "E.时限的规定应当合理"
                ],
                correctAnswers: ["B", "C", "E"]
            }
            // 更多题目可以继续添加...
        ];

        // 应用状态
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let timer;
        let timeLeft = 60; // 60秒倒计时
        let questions = []; // 随机抽取的30道题

        // DOM元素
        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        const questionNumberElement = document.getElementById('question-number');
        const questionTextElement = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const optionsLabelsElement = document.getElementById('options-labels');
        const nextBtn = document.getElementById('next-btn');
        const submitBtn = document.getElementById('submit-btn');
        const timerElement = document.getElementById('timer');
        const progressElement = document.getElementById('progress');
        const scoreElement = document.getElementById('score');
        const correctCountElement = document.getElementById('correct-count');
        const totalCountElement = document.getElementById('total-count');
        const resultDetailsElement = document.getElementById('result-details');
        const restartBtn = document.getElementById('restart-btn');

        // 初始化应用
        function init() {
            // 随机抽取30道题
            questions = getRandomQuestions(30);
            
            // 初始化用户答案数组
            userAnswers = Array(questions.length).fill([]);
            
            // 显示第一题
            showQuestion(currentQuestionIndex);
            
            // 开始倒计时
            startTimer();
            
            // 添加事件监听器
            nextBtn.addEventListener('click', goToNextQuestion);
            submitBtn.addEventListener('click', submitQuiz);
            restartBtn.addEventListener('click', restartQuiz);
        }

        // 随机抽取指定数量的题目
        function getRandomQuestions(count) {
            const shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        // 显示问题
        function showQuestion(index) {
            const question = questions[index];
            
            // 更新问题编号和文本
            questionNumberElement.textContent = `题目 ${index + 1} / ${questions.length}`;
            questionTextElement.textContent = question.question;
            
            // 更新进度条
            progressElement.style.width = `${((index + 1) / questions.length) * 100}%`;
            
            // 清空选项容器
            optionsContainer.innerHTML = '';
            
            // 创建选项元素
            question.options.forEach((option, i) => {
                const optionElement = document.createElement('div');
                optionElement.className = 'option';
                
                // 检查是否已选择该选项
                const isSelected = userAnswers[index].includes(option.charAt(0));
                if (isSelected) {
                    optionElement.classList.add('selected');
                }
                
                optionElement.innerHTML = `
                    <div class="option-label">${option.charAt(0)}</div>
                    <div class="option-text">${option}</div>
                `;
                
                // 注意：这里不再添加点击事件，因为选项区域已禁用点击
                
                optionsContainer.appendChild(optionElement);
            });
            
            // 动态生成左下角字母按钮
            generateOptionLetters(question.options);
            
            // 更新按钮状态
            if (index === questions.length - 1) {
                nextBtn.style.display = 'none';
                submitBtn.style.display = 'block';
            } else {
                nextBtn.style.display = 'block';
                submitBtn.style.display = 'none';
            }
        }

        // 动态生成左下角字母按钮
        function generateOptionLetters(options) {
            // 清空字母按钮容器
            optionsLabelsElement.innerHTML = '';
            
            // 为每个选项创建一个字母按钮
            options.forEach(option => {
                const optionLetter = option.charAt(0);
                const letterElement = document.createElement('div');
                letterElement.className = 'option-letter';
                letterElement.setAttribute('data-value', optionLetter);
                letterElement.textContent = optionLetter;
                
                // 检查是否已选择该选项
                const isSelected = userAnswers[currentQuestionIndex].includes(optionLetter);
                if (isSelected) {
                    letterElement.classList.add('selected');
                }
                
                // 添加点击事件
                letterElement.addEventListener('click', () => {
                    toggleOption(optionLetter);
                });
                
                optionsLabelsElement.appendChild(letterElement);
            });
        }

        // 切换选项选择状态
        function toggleOption(optionLetter) {
            const currentAnswers = [...userAnswers[currentQuestionIndex]];
            
            if (currentAnswers.includes(optionLetter)) {
                // 如果已经选中，则取消选择
                userAnswers[currentQuestionIndex] = currentAnswers.filter(a => a !== optionLetter);
            } else {
                // 否则添加选项
                userAnswers[currentQuestionIndex] = [...currentAnswers, optionLetter];
            }
            
            // 重新显示当前问题以更新选项状态
            showQuestion(currentQuestionIndex);
        }

        // 转到下一题
        function goToNextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                showQuestion(currentQuestionIndex);
            }
        }

        // 开始计时器
        function startTimer() {
            updateTimerDisplay();
            
            timer = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();
                
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    submitQuiz();
                }
            }, 1000);
        }

        // 更新计时器显示
        function updateTimerDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // 当时间少于10秒时改变颜色
            if (timeLeft <= 10) {
                timerElement.style.color = '#ff5252';
            }
        }

        // 提交答案
        function submitQuiz() {
            clearInterval(timer);
            
            // 计算得分
            let score = 0;
            questions.forEach((question, index) => {
                const userAnswer = userAnswers[index].sort().join('');
                const correctAnswer = question.correctAnswers.sort().join('');
                
                if (userAnswer === correctAnswer) {
                    score++;
                }
            });
            
            // 显示结果
            quizContainer.style.display = 'none';
            resultContainer.style.display = 'flex';
            
            // 更新分数和统计
            scoreElement.textContent = score;
            correctCountElement.textContent = score;
            totalCountElement.textContent = questions.length;
            
            // 显示答题详情
            resultDetailsElement.innerHTML = '';
            questions.forEach((question, index) => {
                const userAnswer = userAnswers[index].sort().join(', ');
                const correctAnswer = question.correctAnswers.sort().join(', ');
                const isCorrect = userAnswer === correctAnswer;
                
                const resultItem = document.createElement('div');
                resultItem.className = `result-item ${isCorrect ? 'correct' : 'incorrect'}`;
                
                resultItem.innerHTML = `
                    <div><strong>题目 ${index + 1}:</strong> ${question.question}</div>
                    <div class="question-review">
                        <div>您的答案: <span class="user-answer">${userAnswer || '未作答'}</span></div>
                        <div>正确答案: <span class="correct-answer">${correctAnswer}</span></div>
                    </div>
                `;
                
                resultDetailsElement.appendChild(resultItem);
            });
        }

        // 重新开始答题
        function restartQuiz() {
            // 重置状态
            currentQuestionIndex = 0;
            questions = getRandomQuestions(30);
            userAnswers = Array(questions.length).fill([]);
            timeLeft = 60;
            
            // 重置UI
            quizContainer.style.display = 'flex';
            resultContainer.style.display = 'none';
            timerElement.style.color = 'white';
            
            // 显示第一题
            showQuestion(currentQuestionIndex);
            
            // 重新开始计时
            startTimer();
        }

        // 初始化应用
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
